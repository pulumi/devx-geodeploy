apiVersion: apps/v1
kind: Deployment
metadata:
  name: geodeploy-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geodeploy-test-app
  template:
    metadata:
      labels:
        app: geodeploy-test-app
    spec:
      containers:
        - name: app
          image: example.com/geodeploy/api:v1
